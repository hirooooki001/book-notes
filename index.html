<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>かみくだき読書ノート</title>
  <meta name="description" content="読んだ本を自分の言葉でかみくだいて要約するノート。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">かみくだき読書ノート</a>
      <a class="nav-write" id="write-link" href="write.html" hidden>✎ 書く</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Reading → Explaining</p>
      <h1>読んだ本を、<br>自分の言葉でかみくだく。</h1>
      <p class="lead">本の内容を「人に説明できる」ところまで落とし込むためのノートです。各記事は「一言で」「3つの要点」「中学生に説明するなら」「身近な例」の順に書いています。</p>
      <div class="stats" id="stats"></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="タイトル・著者・キーワードで検索" aria-label="検索">
      <div class="chips" id="chips"></div>
    </section>

    <section class="grid" id="list" aria-live="polite"></section>
    <p class="empty" id="empty" hidden>該当する本が見つかりませんでした。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">© <span id="year"></span> かみくだき読書ノート</div>
  </footer>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
